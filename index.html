<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEO 2026 H2 关键节点 · 挂历看板</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f8f7f4; color: #1a1a1a; padding: 32px 4%; }

  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
  .header-left h1 { font-size: 26px; font-weight: 700; }
  .sub { color: #999; font-size: 13px; margin-bottom: 20px; }
  .header-logo { max-height: 84px; width: auto; }

  .toolbar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
  .btn { padding: 8px 16px; border-radius: 8px; border: 1px solid #d1d5db; background: #fff; font-size: 13px; cursor: pointer; font-family: inherit; transition: all .15s; }
  .btn:hover { background: #f3f4f6; }
  .btn.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
  .btn.primary:hover { background: #1d4ed8; }
  .btn.danger { color: #ef4444; border-color: #fecaca; }
  .btn.danger:hover { background: #fef2f2; }
  .btn.small { padding: 4px 10px; font-size: 12px; }

  .legend { display: flex; gap: 20px; margin-bottom: 24px; font-size: 13px; align-items: center; flex-wrap: wrap; }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .l-dot { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .l-dot.expo { background: #2563eb; } .l-dot.promo { background: #f59e0b; }
  .l-dot.fest { background: #ef4444; } .l-dot.newp { background: #10b981; }

  /* Edit Panel */


  /* Calendar */
  .calendar { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }

  .month { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  .month-header { padding: 14px 18px; font-size: 16px; font-weight: 700; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; }
  .month-header .year { font-size: 12px; color: #999; font-weight: 400; }

  .month-body { padding: 8px 10px; }
  .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 11px; color: #aaa; padding: 4px 0 6px; }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .day { aspect-ratio: 1; display: flex; align-items: flex-start; justify-content: center; padding: 3px 0 0; font-size: 13px; border-radius: 6px; position: relative; }
  .day.empty { visibility: hidden; }
  .day .num { position: relative; z-index: 1; }
  .day.circled .num::after {
    content: ''; position: absolute; top: -4px; left: -8px;
    width: calc(100% + 16px); height: calc(100% + 8px);
    border-radius: 45% 48% 47% 44%; border: 2.5px solid;
    transform: rotate(-3deg);
  }
  .day.circled.expo .num::after { border-color: #2563eb; }
  .day.circled.promo .num::after { border-color: #f59e0b; }
  .day.circled.fest .num::after { border-color: #ef4444; }
  .day.circled.newp .num::after { border-color: #10b981; }
  .day.multi { position: relative; }
  .day.multi .ring { position: absolute; top: -3px; left: -7px; width: calc(100% + 14px); height: calc(100% + 6px); border-radius: 47% 44% 45% 46%; border: 2.5px solid; }
  .day.multi .ring.r1 { top: -5px; left: -9px; width: calc(100% + 18px); height: calc(100% + 10px); transform: rotate(2deg); border-radius: 44% 47% 43% 46%; }
  .day.multi .ring.r2 { top: -1px; left: -5px; width: calc(100% + 10px); height: calc(100% + 2px); transform: rotate(-4deg); border-radius: 48% 43% 46% 44%; }
  .day.multi .ring.expo { border-color: #2563eb; }
  .day.multi .ring.promo { border-color: #f59e0b; }
  .day.multi .ring.fest { border-color: #ef4444; }
  .day.multi .ring.newp { border-color: #10b981; }

  .events-panel { padding: 12px 18px 16px; border-top: 1px solid #f0f0f0; }
  .evt { font-size: 12px; padding: 4px 0; display: flex; align-items: flex-start; gap: 6px; }
  .evt .e-dot { width: 8px; height: 8px; border-radius: 2px; margin-top: 3px; flex-shrink: 0; }
  .e-dot.expo { background: #2563eb; } .e-dot.promo { background: #f59e0b; }
  .e-dot.fest { background: #ef4444; } .e-dot.newp { background: #10b981; }

  .summary { margin-top: 28px; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  .s-card { background: #fff; border-radius: 10px; padding: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  .s-card h3 { font-size: 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
  .s-card p { font-size: 13px; color: #555; line-height: 1.7; }

  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1f2937; color: #fff; padding: 10px 24px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .3s; z-index: 100; }
  .toast.show { opacity: 1; }

  @media print { body { padding: 16px; } .toolbar, .edit-panel { display: none !important; } .month { box-shadow: none; border: 1px solid #e5e5e5; break-inside: avoid; } }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>GEO 2026 H2 关键节点</h1>
    <p class="sub">展会 · 促销 · 节日 · 新品 | 数据源：Google Sheets（多人实时协作）</p>
  </div>
  <img class="header-logo" src="GEO_logo.png" alt="Good Earth Oils">
</div>

<div class="toolbar">
  <button class="btn" onclick="loadFromSheet()">🔄 刷新</button>
  <span style="font-size:12px;color:#999;margin-left:8px" id="refreshInfo"></span>
  <span style="margin-left:auto;font-size:12px;color:#999">编辑→<a href="https://docs.google.com/spreadsheets/d/1d5X3DtDiTuk85wHoRRi-aSZJjalREQVOgOtioBifxN8/edit" target="_blank" style="color:#2563eb">Google Sheets</a></span>
</div>

<div class="legend">
  <span><span class="l-dot expo"></span> 展会</span>
  <span><span class="l-dot promo"></span> 促销</span>
  <span><span class="l-dot fest"></span> 节日</span>
  <span><span class="l-dot newp"></span> 新品到仓</span>
</div>

<div class="calendar" id="calendar"></div>

<div class="summary" id="summary"></div>

<div class="toast" id="toast"></div>

<script>
const SHEET_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQyB0heDXoqSEpJw_jUMv7Of_VILcm1MCldp4Y9a1PI1GpKeDl02BBFNCKRhFqBPYcqrdZxPDrgqx0B/pub?output=csv';
const TYPE_TRANSLATE = { '展会': 'expo', '促销': 'promo', '节日': 'fest', '新品': 'newp' };
let events = [];

// Parse CSV from Google Sheets
function parseCSV(csv) {
  const lines = csv.trim().split('\n');
  if (lines.length < 2) return [];
  return lines.slice(1).map(line => {
    // Handle commas within quoted fields
    const cols = [];
    let col = '', inQuotes = false;
    for (let c of line) {
      if (c === '"') { inQuotes = !inQuotes; continue; }
      if (c === ',' && !inQuotes) { cols.push(col.trim()); col = ''; continue; }
      col += c;
    }
    cols.push(col.trim());
    return {
      type: TYPE_TRANSLATE[cols[0]] || 'promo',
      date: cols[1] || '',
      endDate: cols[2] || '',
      title: cols[3] || '',
      desc: cols[4] || ''
    };
  }).filter(e => e.date && e.title);
}

async function loadFromSheet() {
  try {
    const resp = await fetch(SHEET_CSV + '&_=' + Date.now());
    const csv = await resp.text();
    events = parseCSV(csv);
    events.sort((a,b) => a.date.localeCompare(b.date));
    buildCalendar();
    const now = new Date();
    document.getElementById('refreshInfo').textContent = `${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')} (Sheet)`;
  } catch(e) {
    // Fallback: offline or CORS blocked (e.g. file://)
    events = parseCSV(`类型,日期,结束日期,标题,描述
新品,2026-07-15,,2L冷榨芥花籽油、500ml特级初榨芥花籽油,
新品,2026-07-15,,500ml特级初榨橄榄油、4L特级初榨橄榄油,
促销,2026-08-01,,中秋促销启动,京东活动报名 · 礼盒优先 · 小红书种草
展会,2026-09-03,2026-09-05,Sial 广州食品展,TIQ暂定 · 进口食品专业展
新品,2026-09-15,,500ml牛油果油、500ml礼盒装,
节日,2026-09-25,,中秋节,促销收尾 · 礼品渠道冲刺
展会,2026-10-20,2026-10-23,深圳礼品展秋季,友商联合 · 礼盒/集采渠道
展会,2026-11-05,2026-11-10,上海进博会 CIIE,全年最重要 · 国家馆背书
促销,2026-12-15,,春节促销启动,年货季 · 礼盒+4L双线 · 京东年货节
节日,2027-02-06,,春节,促销收尾`);
    events.sort((a,b) => a.date.localeCompare(b.date));
    buildCalendar();
    document.getElementById('refreshInfo').textContent = '离线模式（内置数据）';
  }
}

function getMonthKey(y, m) { return `${y}-${m}`; }

function buildCalendar() {
  if (events.length === 0) { document.getElementById('calendar').innerHTML = '<p style="color:#999;text-align:center;padding:40px">加载数据中…</p>'; return; }

  let minDate = null, maxDate = null;
  events.forEach(e => {
    const d = new Date(e.date + 'T00:00:00');
    if (!minDate || d < minDate) minDate = d;
    if (!maxDate || d > maxDate) maxDate = d;
    if (e.endDate) {
      const ed = new Date(e.endDate + 'T00:00:00');
      if (ed > maxDate) maxDate = ed;
    }
  });
  if (!minDate || !maxDate) return;

  let startY = minDate.getFullYear(), startM = minDate.getMonth() + 1;
  let endY = maxDate.getFullYear(), endM = maxDate.getMonth() + 1;

  const months = [];
  let y = startY, m = startM;
  while (y < endY || (y === endY && m <= endM)) {
    months.push({ year: y, month: m });
    m++; if (m > 12) { m = 1; y++; }
  }

  const dayMarkers = {};
  const monthEvents = {};
  events.forEach(e => {
    const mk = `${new Date(e.date+'T00:00:00').getFullYear()}-${new Date(e.date+'T00:00:00').getMonth()+1}`;
    if (!monthEvents[mk]) monthEvents[mk] = [];
    monthEvents[mk].push(e);
    if (!dayMarkers[e.date]) dayMarkers[e.date] = [];
    if (!dayMarkers[e.date].includes(e.type)) dayMarkers[e.date].push(e.type);
    if (e.endDate) {
      const start = new Date(e.date + 'T00:00:00');
      const end = new Date(e.endDate + 'T00:00:00');
      const cur = new Date(start);
      cur.setDate(cur.getDate() + 1);
      while (cur <= end) {
        const ds = cur.toISOString().slice(0,10);
        if (!dayMarkers[ds]) dayMarkers[ds] = [];
        if (!dayMarkers[ds].includes(e.type)) dayMarkers[ds].push(e.type);
        cur.setDate(cur.getDate() + 1);
      }
    }
  });

  const weekdays = ['一','二','三','四','五','六','日'];

  let html = '';
  months.forEach(({year, month}) => {
    const mk = getMonthKey(year, month);
    const mEvts = monthEvents[mk] || [];
    const firstDay = new Date(year, month-1, 1).getDay();
    const daysInMonth = new Date(year, month, 0).getDate();
    const adjFirstDay = firstDay === 0 ? 6 : firstDay - 1;

    html += `<div class="month">`;
    html += `<div class="month-header">${month}月 <span class="year">${year}</span></div>`;
    html += `<div class="month-body">`;
    html += `<div class="weekdays">${weekdays.map(w=>`<span>${w}</span>`).join('')}</div>`;
    html += `<div class="days">`;
    for (let i = 0; i < adjFirstDay; i++) html += `<span class="day empty"></span>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const ds = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const markers = dayMarkers[ds] || [];
      let cls = 'day';
      let inner = `<span class="num">${d}</span>`;
      if (markers.length === 1) {
        cls += ' circled ' + markers[0];
      } else if (markers.length > 1) {
        cls += ' multi';
        const rings = markers.map((t,i) => `<span class="ring r${i+1} ${t}"></span>`).join('');
        inner = rings + `<span class="num">${d}</span>`;
      }
      html += `<span class="${cls}">${inner}</span>`;
    }
    html += `</div></div>`;
    html += `<div class="events-panel">`;
    if (mEvts.length > 0) {
      mEvts.forEach(e => {
        const dateStr = formatDateRange(e.date, e.endDate);
        html += `<div class="evt"><span class="e-dot ${e.type}"></span> ${dateStr} ${e.title}${e.desc ? ' —— ' + e.desc : ''}</div>`;
      });
    } else {
      html += `<div class="evt" style="color:#ccc;font-style:italic">暂无节点</div>`;
    }
    html += `</div></div>`;
  });
  document.getElementById('calendar').innerHTML = html;

  const summExpo = events.filter(e=>e.type==='expo');
  const summPromo = events.filter(e=>e.type==='promo');
  const summNewp = events.filter(e=>e.type==='newp');
  const summFest = events.filter(e=>e.type==='fest');
  document.getElementById('summary').innerHTML = [
    summNewp.length ? card('🆕 新品到仓', summNewp) : '',
    summExpo.length ? card('🎪 展会', summExpo) : '',
    summPromo.length ? card('📢 促销', summPromo) : '',
    summFest.length ? card('🎉 节日', summFest) : '',
  ].join('');

  function card(title, items) {
    return `<div class="s-card"><h3>${title}</h3><p>${items.map(e=>formatDateRange(e.date,e.endDate)+'&nbsp;&nbsp;'+e.title+(e.desc?' —— '+e.desc:'')).join('<br>')}</p></div>`;
  }
}

function formatDateRange(date, endDate) {
  if (!endDate) return date;
  const sd = new Date(date+'T00:00:00');
  const ed = new Date(endDate+'T00:00:00');
  if (sd.getMonth() === ed.getMonth()) return `${sd.getMonth()+1}/${sd.getDate()}–${ed.getDate()}`;
  return `${sd.getMonth()+1}/${sd.getDate()}→${ed.getMonth()+1}/${ed.getDate()}`;
}

// Init
loadFromSheet();
// Auto-refresh every 60 seconds
setInterval(loadFromSheet, 60000);
</script>
</body>
</html>
